name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # malssak.com 커스텀 도메인으로 루트 경로에서 서빙된다(public/CNAME 참고).
          # 예전엔 https://<user>.github.io/<repo>/ 하위 경로라 VITE_BASE를 저장소
          # 이름으로 맞췄지만, 커스텀 도메인부터는 vite.config.ts의 기본값 '/'을 그대로 쓴다.
          VITE_BASE: /
          # 계정 기능을 아직 안 쓰면(Secrets 미설정) 둘 다 빈 값이 되고,
          # 앱은 자동으로 게스트 모드로 빌드된다 — 별도 분기 없이 그냥 통과시킨다.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
